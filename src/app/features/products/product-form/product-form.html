<div class="max-w-2xl mx-auto space-y-6">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 text-center">
            {{ isEditMode ? 'Modifier le produit' : 'Nouveau produit' }}
        </h1>
    </div>



    <app-card>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

            <app-input formControlName='title' label="Titre" placeholder="Ex:iPhone 17" [errorMessage]="titleError">
            </app-input>

            <app-input formControlName='description' label="Description" placeholder="Ex:smartphone de qualité"
                [errorMessage]="descriptionError">
            </app-input>

            <div class="grid grid-cols-2 gap-4">
                <app-input formControlName='price' label="Prix" placeholder="Ex:300 €" [errorMessage]="priceError">
                </app-input>
                <app-input formControlName='stock' label="Stock" placeholder="Ex: 14" [errorMessage]="stockError">
                </app-input>
            </div>

            <app-input formControlName='category' label="Categorie" placeholder="Ex : Smartphone"
                [errorMessage]="categoryError">
            </app-input>

            <app-input formControlName='thumbnail' label="Thumbnail" placeholder="https://..."
                [errorMessage]="thumbnailError">
            </app-input>

            <div class="flex justify-center gap-3 pt-2">
                <app-button type="submit" variant="success" [disabled]="store.loading()">
                    @if (store.loading()) {
                    Enregistrement...
                    } @else {
                    {{ isEditMode ? 'Enregistrer' : 'Créer' }}
                    }
                </app-button>

                <app-button variant="secondary" type="button" (click)="router.navigate(['/products'])">
                    Annuler
                </app-button>
            </div>
        </form>
    </app-card>
</div>
